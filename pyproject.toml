[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ny Aro Rasolonjanahary Mandimby", email = "nyarorasolonjanaharymandimby@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
]

[tool.mypy]
exclude = ["llm_sdk/"]
